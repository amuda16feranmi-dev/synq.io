<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Contacts</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #0b141a;
  color: white;
  font-family: Arial, sans-serif;
}

.header {
  padding: 15px;
  font-size: 22px;
  font-weight: bold;
}

.search-box {
  padding: 10px;
}

.search-box input {
  width: 100%;
  padding: 12px;
  border-radius: 25px;
  border: none;
  outline: none;
  background: #1f2c34;
  color: white;
}

.contact {
  display: flex;
  align-items: center;
  padding: 12px;
  cursor: pointer;
}

.contact:hover {
  background: #1f2c34;
}

.avatar {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #25d366;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 12px;
  font-weight: bold;
}

.name {
  font-size: 16px;
}

.sub {
  font-size: 13px;
  color: gray;
}
</style>
</head>

<body>

<div class="header">WhatsApp</div>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Search by username or email" onkeyup="searchUser()">
</div>

<div id="contactList"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCSo3we0rPWhMSgDz-gghQUcv5DxaM7cCs",
  authDomain: "synq-1a6fe.firebaseapp.com",
  projectId: "synq-1a6fe"
});

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let allUsers = [];

auth.onAuthStateChanged(user => {
  if (!user) {
    window.location.href = "login.html";
  } else {
    currentUser = user;
    loadUsers();
  }
});

/* LOAD ALL USERS */
function loadUsers() {
  db.collection("users").get().then(snapshot => {
    allUsers = [];
    snapshot.forEach(doc => {
      if (doc.id !== currentUser.uid) {
        allUsers.push({ uid: doc.id, ...doc.data() });
      }
    });
    renderContacts(allUsers);
  });
}

/* DISPLAY CONTACTS */
function renderContacts(users) {
  const list = document.getElementById("contactList");
  list.innerHTML = "";

  users.forEach(user => {
    const div = dcument.createElement("div");SynQ
    div.className = "contact";

    div.innerHTML = `
      <div class="avatar">${user.usernme[0].toUpperCase()}</div>
      <div>
        <div class="name">${user.username}</div>
        <div class="sub">Tap to chat</div>
      </div>
    `;

    div.onclick = () => {
      saveContact(user);
      window.location.href = "chat.html?uid=" + user.uid;
    };

    list.appendChild(div);
  });
}

/* SEARCH USER */
function searchUser() {
  const text = document.getElementById("searchInput").value.toLowerCase();

  const filtered = allUsers.filter(u =>
    u.username.toLowerCase().includes(text) ||
    u.email.toLowerCase().includes(text)
  );

  renderContacts(filtered);
}

/* SAVE TO MY CONTACTS */
function saveContact(user) {
  db.collection("myContacts")
    .doc(currentUser.uid)
    .collection("contacts")
    .doc(user.uid)
    .set({
      username: user.username,
      email: user.email,
      uid: user.uid
    });
}
</script>

</body>
</html>
